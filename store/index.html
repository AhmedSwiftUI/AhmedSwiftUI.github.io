<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>رفّ</title>
<meta name="description" content="رفّ: متجر للمنتجات السعودية المختارة">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --label:#000000; --secondary:#3C3C43; --tertiary:#8E8E93; --sep:rgba(60,60,67,.18); --fill:#E5E5EA; --fill2:#F2F2F7;
  --blue:#007AFF; --blue-press:#0066D6; --green:#34C759; --red:#FF3B30;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Arabic","Helvetica Neue","IBM Plex Sans Arabic","Segoe UI",sans-serif;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--label);font-family:var(--font);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}

/* Nav bar */
.bar{position:sticky;top:0;z-index:20;background:rgba(249,249,249,.82);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--sep)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;height:52px}
.brand{font-weight:700;font-size:20px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand i{width:26px;height:26px;border-radius:7px;background:var(--blue);display:inline-grid;place-items:center}
.brand i svg{width:16px;height:16px;fill:#fff}
.bar .actions{display:flex;gap:6px}
.icon-btn{width:38px;height:38px;border-radius:19px;display:grid;place-items:center;color:var(--blue);position:relative}
.icon-btn:active{background:var(--fill)}
.icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:3px;left:3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.badge[hidden]{display:none}

/* Header */
.banner{position:relative;margin-top:16px;border-radius:var(--r);overflow:hidden;aspect-ratio:21/9;min-height:200px;background:#1C1C1E}
.banner img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}
.banner .txt{position:absolute;inset:auto 0 0 0;padding:22px 24px;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.62));color:#fff}
.banner h1{font-size:30px;font-weight:700;margin:0;letter-spacing:-.02em;line-height:1.2}
.banner p{margin:4px 0 0;font-size:16px;opacity:.9}
@media (max-width:600px){.banner{aspect-ratio:16/10}.banner h1{font-size:24px}}
.hero{padding:8px 0 8px}
.hero h1{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.2}
.hero p{margin:6px 0 0;color:var(--secondary);opacity:.7;font-size:17px}
.search{margin-top:16px;display:flex;align-items:center;gap:8px;background:rgba(118,118,128,.12);border-radius:10px;padding:8px 10px;color:var(--tertiary)}
.search svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:17px;color:var(--label)}
.search input::placeholder{color:var(--tertiary)}

/* Chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none;-ms-overflow-style:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;background:var(--card);border:1px solid var(--sep);font-size:15px;font-weight:500;color:var(--label)}
.chip.on{background:var(--label);color:#fff;border-color:var(--label)}

/* Sections */
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 12px}
.sec h2{font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em}
.sec span{color:var(--tertiary);font-size:15px;font-variant-numeric:tabular-nums}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;padding-bottom:48px}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;text-align:start;display:flex;flex-direction:column;transition:transform .15s}
.card:active{transform:scale(.98)}
.thumb{aspect-ratio:1;margin:8px 8px 0;border-radius:12px;background:#EEEFF3;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.card:hover .thumb img{transform:scale(1.04)}
.thumb svg{width:38%;height:38%;fill:none;stroke:#1C1C1E;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.card .info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.card .name{font-weight:600;font-size:15px;line-height:1.3}
.card .cat{color:var(--tertiary);font-size:13px}
.card .row{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.price{font-weight:600;font-variant-numeric:tabular-nums}
.price small{font-weight:500;color:var(--tertiary);font-size:.85em;margin-right:2px}
.add{width:30px;height:30px;border-radius:15px;background:var(--blue);color:#fff;display:grid;place-items:center}
.add svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.add:active{background:var(--blue-press)}

/* Sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:40;background:var(--bg);box-shadow:0 -4px 30px rgba(0,0,0,.12);display:flex;flex-direction:column;
  inset:auto 0 0 0;max-height:92vh;border-radius:18px 18px 0 0;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet.show{transform:none}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:rgba(60,60,67,.3);margin:8px auto 0;flex:none}
.sheet .head{display:flex;align-items:center;justify-content:space-between;padding:8px 20px 10px;flex:none}
.sheet .head h3{margin:0;font-size:17px;font-weight:600}
.sheet .close{color:var(--blue);font-weight:500;font-size:17px}
.sheet .content{overflow:auto;padding:0 20px 20px;flex:1}
.sheet .foot{flex:none;padding:12px 20px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--sep)}
@media (min-width:720px){
  .sheet{inset:50% auto auto 50%;transform:translate(-50%,-45%);opacity:0;width:min(560px,92vw);max-height:84vh;border-radius:18px;pointer-events:none;transition:transform .25s,opacity .25s}
  .sheet.show{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
  .sheet .grab{display:none}
  .sheet.drawer{inset:0 0 0 auto;left:0;right:auto;width:min(420px,92vw);max-height:none;border-radius:0;transform:translateX(-100%);opacity:1}
  .sheet.drawer.show{transform:none}
}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border-radius:14px;background:var(--blue);color:#fff;font-weight:600;font-size:17px;transition:background .15s}
.btn:active{background:var(--blue-press)}
.btn.done{background:var(--green)}
.btn[disabled]{background:var(--fill);color:var(--tertiary)}

/* Product detail */
.detail .big{aspect-ratio:4/3;border-radius:var(--r);background:#EEEFF3;overflow:hidden;margin-top:4px}
.detail .big img{width:100%;height:100%;object-fit:cover;display:block}
.detail .big svg{width:36%;height:36%;fill:none;stroke:#1C1C1E;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.detail h2{font-size:24px;font-weight:700;margin:16px 0 2px;letter-spacing:-.01em}
.detail .cat{color:var(--tertiary);font-size:15px}
.detail .price{font-size:22px;margin-top:8px;display:block}
.detail .desc{color:var(--secondary);margin-top:12px;line-height:1.6}
.qty{display:inline-flex;align-items:center;background:var(--fill);border-radius:10px;height:36px;font-variant-numeric:tabular-nums}
.qty button{width:40px;height:36px;font-size:20px;color:var(--label);display:grid;place-items:center}
.qty span{min-width:28px;text-align:center;font-weight:600}
.detail .qrow{display:flex;align-items:center;justify-content:space-between;margin-top:18px}
.detail .qrow label{color:var(--secondary);font-size:15px}

/* Cart */
.list{background:var(--card);border-radius:var(--r);overflow:hidden}
.item{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--sep)}
.item:last-child{border-bottom:0}
.item .t{width:56px;height:56px;border-radius:12px;background:#EEEFF3;overflow:hidden}
.item .t img{width:100%;height:100%;object-fit:cover;display:block}
.item .t svg{width:26px;height:26px;fill:none;stroke:#1C1C1E;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.item .n{font-weight:600;font-size:15px}
.item .p{color:var(--tertiary);font-size:13px;font-variant-numeric:tabular-nums}
.item .qty{height:30px}
.item .qty button{height:30px;width:34px;font-size:18px}
.empty{text-align:center;color:var(--tertiary);padding:56px 0}
.empty svg{width:52px;height:52px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;margin-bottom:8px}
.sum{background:var(--card);border-radius:var(--r);margin-top:16px;padding:4px 14px}
.sum div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--sep);font-variant-numeric:tabular-nums}
.sum div:last-child{border:0;font-weight:700;font-size:18px}
.sum div span:first-child{color:var(--secondary)}
.sum div:last-child span:first-child{color:var(--label)}
.group-title{font-size:13px;color:var(--tertiary);text-transform:none;margin:18px 14px 6px;letter-spacing:.02em}

/* Form */
.form{background:var(--card);border-radius:var(--r);overflow:hidden}
.field{display:flex;align-items:center;gap:12px;padding:0 14px;height:46px;border-bottom:1px solid var(--sep)}
.field:last-child{border:0}
.field label{color:var(--label);width:84px;flex:none;font-size:16px}
.field input,.field select{flex:1;min-width:0;border:0;background:none;outline:none;font-size:17px;color:var(--label);text-align:start}
.field input::placeholder{color:var(--tertiary)}
.seg{display:flex;background:rgba(118,118,128,.12);border-radius:9px;padding:2px;margin-top:8px}
.seg button{flex:1;height:32px;border-radius:7px;font-size:14px;font-weight:500;color:var(--label)}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* Confirmation */
.ok{text-align:center;padding:30px 0 10px}
.ok .mark{width:72px;height:72px;border-radius:36px;background:var(--green);display:grid;place-items:center;margin:0 auto 16px}
.ok .mark svg{width:36px;height:36px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ok h2{margin:0;font-size:24px;font-weight:700}
.ok p{color:var(--secondary);margin:8px 0 0}
.ok .num{display:inline-block;margin-top:14px;background:var(--card);border-radius:10px;padding:8px 14px;font-weight:600;font-variant-numeric:tabular-nums;direction:ltr}

/* Toast */
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,20px);background:rgba(28,28,30,.92);color:#fff;padding:10px 18px;border-radius:14px;font-size:15px;font-weight:500;opacity:0;transition:.25s;z-index:50;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

footer{color:var(--tertiary);font-size:13px;text-align:center;padding:12px 0 calc(28px + env(safe-area-inset-bottom))}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="bar"><div class="wrap">
  <div class="brand"><i><svg viewBox="0 0 24 24"><path d="M3 5h18v3H3zM3 11h18v3H3zM3 17h18v3H3z"/></svg></i>رفّ</div>
  <div class="actions">
    <button class="icon-btn" id="openCart" aria-label="السلة"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.5L21 8H6.5"/><circle cx="10" cy="20" r="1.2"/><circle cx="17" cy="20" r="1.2"/></svg><span class="badge" id="badge" hidden>0</span></button>
    <button class="icon-btn" aria-label="حسابي"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="4"/><path d="M4 20c1.5-3.8 4.3-5.5 8-5.5s6.5 1.7 8 5.5"/></svg></button>
  </div>
</div></header>

<main class="wrap">
  <div class="banner"><img src="img/hero.jpg" alt=""><div class="txt"><h1>مختارات من المملكة</h1><p>قهوة وتمور وبهارات وعطور من مصادرها الأصلية.</p></div></div>
  <div class="hero">
    <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg><input id="q" type="search" placeholder="ابحث في المنتجات" autocomplete="off"></label>
  </div>
  <div class="chips" id="chips"></div>
  <div class="sec"><h2 id="secTitle">الأكثر طلبًا</h2><span id="count"></span></div>
  <div class="grid" id="grid"></div>
</main>
<footer>رفّ · نموذج تجريبي، لا تُنفَّذ طلبات حقيقية</footer>

<div class="scrim" id="scrim"></div>

<div class="sheet detail" id="detail" role="dialog" aria-modal="true" aria-labelledby="dName">
  <div class="grab"></div>
  <div class="head"><h3>المنتج</h3><button class="close" data-close>إغلاق</button></div>
  <div class="content">
    <div class="big" id="dIcon"></div>
    <h2 id="dName"></h2>
    <div class="cat" id="dCat"></div>
    <span class="price" id="dPrice"></span>
    <p class="desc" id="dDesc"></p>
    <div class="qrow"><label>الكمية</label><div class="qty"><button id="qMinus" aria-label="أقل">−</button><span id="qVal">1</span><button id="qPlus" aria-label="أكثر">+</button></div></div>
  </div>
  <div class="foot"><button class="btn" id="dAdd">أضف إلى السلة</button></div>
</div>

<div class="sheet drawer" id="cart" role="dialog" aria-modal="true" aria-labelledby="cartTitle">
  <div class="grab"></div>
  <div class="head"><h3 id="cartTitle">السلة</h3><button class="close" data-close>إغلاق</button></div>
  <div class="content" id="cartBody"></div>
  <div class="foot"><button class="btn" id="checkoutBtn">إتمام الطلب</button></div>
</div>

<div class="sheet" id="checkout" role="dialog" aria-modal="true" aria-labelledby="coTitle">
  <div class="grab"></div>
  <div class="head"><h3 id="coTitle">إتمام الطلب</h3><button class="close" data-close>إغلاق</button></div>
  <div class="content">
    <div id="coForm">
      <div class="group-title">بيانات التوصيل</div>
      <form class="form" id="form" novalidate>
        <div class="field"><label for="fName">الاسم</label><input id="fName" placeholder="الاسم الكامل" required></div>
        <div class="field"><label for="fPhone">الجوال</label><input id="fPhone" type="tel" inputmode="numeric" placeholder="05xxxxxxxx" dir="ltr" style="text-align:right" required></div>
        <div class="field"><label for="fCity">المدينة</label><select id="fCity"><option>الرياض</option><option>جدة</option><option>الدمام</option><option>مكة المكرمة</option><option>المدينة المنورة</option></select></div>
        <div class="field"><label for="fAddr">العنوان</label><input id="fAddr" placeholder="الحي، الشارع، رقم المبنى" required></div>
      </form>
      <div class="group-title">طريقة الدفع</div>
      <div class="seg" id="pay"><button class="on" data-pay="Apple Pay">Apple Pay</button><button data-pay="مدى">مدى</button><button data-pay="بطاقة">بطاقة ائتمانية</button></div>
      <div class="sum" id="coSum"></div>
    </div>
    <div id="coDone" hidden>
      <div class="ok">
        <div class="mark"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div>
        <h2>تم استلام طلبك</h2>
        <p>سيصلك خلال يومي عمل. أرسلنا تفاصيل الطلب برسالة نصية.</p>
        <div class="num" id="orderNo"></div>
      </div>
    </div>
  </div>
  <div class="foot"><button class="btn" id="coBtn">تأكيد الطلب</button></div>
</div>

<div class="toast" id="toast"></div>

<script>
var ICONS={
  cup:'<svg viewBox="0 0 24 24"><path d="M4 8h12v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM16 9h2a2.5 2.5 0 0 1 0 5h-2M3 21h14"/></svg>',
  leaf:'<svg viewBox="0 0 24 24"><path d="M20 4C9 4 4 10 4 20c10 0 16-5 16-16zM4 20 14 10"/></svg>',
  sparkle:'<svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></svg>',
  flame:'<svg viewBox="0 0 24 24"><path d="M12 3c1 4 5 5.5 5 10.5A5 5 0 0 1 7 13.5c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3 .5-6 1-9z"/></svg>',
  drop:'<svg viewBox="0 0 24 24"><path d="M12 3s6 7 6 11.5a6 6 0 0 1-12 0C6 10 12 3 12 3z"/></svg>',
  mug:'<svg viewBox="0 0 24 24"><path d="M5 6h11v9a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4zM16 8h2a2.5 2.5 0 0 1 0 5h-2M8 3v2M11 3v2"/></svg>',
  wind:'<svg viewBox="0 0 24 24"><path d="M3 9h11a2.5 2.5 0 1 0-2.5-2.5M3 14h14a2.5 2.5 0 1 1-2.5 2.5M3 19h7a2 2 0 1 1-2 2"/></svg>',
  flower:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5"/><path d="M12 9.5V4M12 14.5V20M9.5 12H4M14.5 12H20M10.2 10.2 6.5 6.5M13.8 13.8l3.7 3.7M13.8 10.2l3.7-3.7M10.2 13.8l-3.7 3.7"/></svg>'
};
var PRODUCTS=[
  {id:1,name:'قهوة عربية مختصة',cat:'قهوة',price:48,img:'coffee',desc:'حبوب محمصة تحميصًا فاتحًا من مزارع جازان، 250 جم.'},
  {id:2,name:'تمر سكري فاخر',cat:'تمور',price:65,img:'dates',desc:'تمر سكري من القصيم، عبوة 1 كجم.'},
  {id:3,name:'هيل أخضر',cat:'بهارات',price:32,img:'cardamom',desc:'هيل كامل عالي الجودة، 250 جم.'},
  {id:4,name:'زعفران',cat:'بهارات',price:120,img:'saffron',desc:'زعفران خيوط فاخر، 5 جم.'},
  {id:5,name:'عسل سدر',cat:'عسل',price:180,img:'honey',desc:'عسل سدر طبيعي، 500 جم.'},
  {id:6,name:'شاي كرك',cat:'شاي',price:28,img:'tea',desc:'خلطة شاي بالحليب والهيل، 20 كيسًا.'},
  {id:7,name:'بخور عود',cat:'عطور',price:95,img:'bakhoor',desc:'بخور عود طبيعي، 50 جم.'},
  {id:8,name:'ماء ورد الطائف',cat:'عطور',price:40,img:'rose',desc:'ماء ورد طبيعي من الطائف، 250 مل.'}
];
var DELIVERY=15;
function pic(p,cls){return '<img class="'+(cls||'')+'" src="img/'+p.img+'.jpg" alt="'+p.name+'" loading="lazy">'}
var cart={}; var current=null; var qty=1; var pay='Apple Pay'; var activeCat='الكل';
function $(s){return document.querySelector(s)}
function money(n){return '<span class="price">'+n+'<small>ر.س</small></span>'}
function byId(id){return PRODUCTS.filter(function(p){return p.id===id})[0]}

/* Chips */
var cats=['الكل'].concat(PRODUCTS.map(function(p){return p.cat}).filter(function(c,i,a){return a.indexOf(c)===i}));
$('#chips').innerHTML=cats.map(function(c){return '<button class="chip'+(c==='الكل'?' on':'')+'" data-cat="'+c+'">'+c+'</button>'}).join('');
$('#chips').addEventListener('click',function(e){var b=e.target.closest('.chip');if(!b)return;activeCat=b.dataset.cat;[].forEach.call(document.querySelectorAll('.chip'),function(x){x.classList.toggle('on',x===b)});render()});
$('#q').addEventListener('input',render);

/* Grid */
function render(){
  var q=$('#q').value.trim();
  var list=PRODUCTS.filter(function(p){return (activeCat==='الكل'||p.cat===activeCat)&&(!q||p.name.indexOf(q)>-1||p.cat.indexOf(q)>-1)});
  $('#secTitle').textContent=q?'نتائج البحث':(activeCat==='الكل'?'الأكثر طلبًا':activeCat);
  $('#count').textContent=list.length+' منتج';
  $('#grid').innerHTML=list.map(function(p){return '<button class="card" data-open="'+p.id+'"><div class="thumb">'+pic(p)+'</div><div class="info"><div class="name">'+p.name+'</div><div class="cat">'+p.cat+'</div><div class="row">'+money(p.price)+'<span class="add" data-add="'+p.id+'" role="button" aria-label="أضف"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span></div></div></button>'}).join('')||'<div class="empty">لا توجد منتجات مطابقة</div>';
}
$('#grid').addEventListener('click',function(e){
  var a=e.target.closest('[data-add]'); if(a){e.stopPropagation();add(+a.dataset.add,1);return}
  var c=e.target.closest('[data-open]'); if(c)openDetail(+c.dataset.open);
});

/* Sheets */
function open(id){$('#scrim').classList.add('show');$(id).classList.add('show')}
function closeAll(){$('#scrim').classList.remove('show');[].forEach.call(document.querySelectorAll('.sheet'),function(s){s.classList.remove('show')})}
$('#scrim').addEventListener('click',closeAll);
[].forEach.call(document.querySelectorAll('[data-close]'),function(b){b.addEventListener('click',closeAll)});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeAll()});

/* Detail */
function openDetail(id){current=byId(id);qty=1;$('#qVal').textContent=qty;$('#dIcon').innerHTML=pic(current);$('#dName').textContent=current.name;$('#dCat').textContent=current.cat;$('#dPrice').innerHTML=current.price+'<small>ر.س</small>';$('#dDesc').textContent=current.desc;var b=$('#dAdd');b.textContent='أضف إلى السلة';b.classList.remove('done');closeAll();open('#detail')}
$('#qMinus').onclick=function(){if(qty>1){qty--;$('#qVal').textContent=qty}};
$('#qPlus').onclick=function(){if(qty<20){qty++;$('#qVal').textContent=qty}};
$('#dAdd').onclick=function(){add(current.id,qty);var b=$('#dAdd');b.textContent='أُضيف إلى السلة';b.classList.add('done');setTimeout(closeAll,700)};

/* Cart */
function add(id,n){cart[id]=(cart[id]||0)+n;updateBadge();toast(byId(id).name+' أُضيف إلى السلة')}
function total(){var t=0;for(var k in cart)t+=byId(+k).price*cart[k];return t}
function countItems(){var c=0;for(var k in cart)c+=cart[k];return c}
function updateBadge(){var n=countItems();var b=$('#badge');b.textContent=n;b.hidden=n===0}
function renderCart(){
  var keys=Object.keys(cart);var body=$('#cartBody');
  if(!keys.length){body.innerHTML='<div class="empty"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.5L21 8H6.5"/><circle cx="10" cy="20" r="1.2"/><circle cx="17" cy="20" r="1.2"/></svg><div>السلة فارغة</div></div>';$('#checkoutBtn').disabled=true;return}
  $('#checkoutBtn').disabled=false;
  body.innerHTML='<div class="list">'+keys.map(function(k){var p=byId(+k);return '<div class="item"><div class="t">'+pic(p)+'</div><div><div class="n">'+p.name+'</div><div class="p">'+p.price+' ر.س × '+cart[k]+'</div></div><div class="qty"><button data-dec="'+k+'" aria-label="أقل">−</button><span>'+cart[k]+'</span><button data-inc="'+k+'" aria-label="أكثر">+</button></div></div>'}).join('')+'</div>'+summary();
}
function summary(){var t=total();return '<div class="sum"><div><span>المجموع</span><span>'+t+' ر.س</span></div><div><span>التوصيل</span><span>'+DELIVERY+' ر.س</span></div><div><span>الإجمالي</span><span>'+(t+DELIVERY)+' ر.س</span></div></div>'}
$('#cartBody').addEventListener('click',function(e){
  var d=e.target.closest('[data-dec]'),i=e.target.closest('[data-inc]');
  if(d){var k=d.dataset.dec;cart[k]--;if(cart[k]<=0)delete cart[k]}
  if(i){cart[i.dataset.inc]++}
  if(d||i){updateBadge();renderCart()}
});
$('#openCart').onclick=function(){renderCart();closeAll();open('#cart')};

/* Checkout */
$('#checkoutBtn').onclick=function(){$('#coForm').hidden=false;$('#coDone').hidden=true;$('#coBtn').textContent='تأكيد الطلب · '+(total()+DELIVERY)+' ر.س';$('#coSum').innerHTML=summary().replace('class="sum"','class="sum" style="margin-top:16px"');closeAll();open('#checkout')};
$('#pay').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;pay=b.dataset.pay;[].forEach.call(this.children,function(x){x.classList.toggle('on',x===b)})});
$('#coBtn').onclick=function(){
  if(!$('#coDone').hidden){closeAll();return}
  var f=$('#form');var bad=[].filter.call(f.querySelectorAll('input[required]'),function(i){return !i.value.trim()});
  if(bad.length){bad[0].focus();toast('أكمل بيانات التوصيل');return}
  var no='RF-2026-'+String(Math.floor(1000+Math.random()*9000));
  $('#orderNo').textContent=no;$('#coForm').hidden=true;$('#coDone').hidden=false;$('#coBtn').textContent='العودة إلى المتجر';
  cart={};updateBadge();
};

/* Toast */
var tt;function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('show')},1600)}

render();
</script>
</body>
</html>
